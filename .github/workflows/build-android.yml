name: Build Android APK

on:
push:
branches:
- main
workflow_dispatch:

jobs:
build:
runs-on: ubuntu-latest
steps:
- uses: actions/checkout@v4
- uses: actions/setup-node@v4
with:
node-version: 20
- uses: actions/setup-java@v4
with:
distribution: temurin
java-version: 17
- name: Install Capacitor
run: npm install
- name: Prepare Web Files
run: mkdir -p www && cp index.html www/ && cp icon-128.png www/
- name: Add Android
run: npx cap add android
- name: Configure Android
run: node scripts/configure-android.js || node configure-android.js
- name: Sync Capacitor
run: npx cap sync android
- name: Build Debug APK
run: cd android && chmod +x gradlew && ./gradlew assembleDebug --no-daemon
- uses: actions/upload-artifact@v4
with:
name: Galactica-RSS-Android
path: android/app/build/outputs/apk/debug/app-debug.apk
