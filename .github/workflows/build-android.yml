name: Build Android APK

on:
push:
branches: [ main ]
workflow_dispatch:

jobs:
build:
runs-on: ubuntu-latest
steps:
- uses: actions/checkout@v4

  - uses: actions/setup-node@v4
    with:
      node-version: '20'

  - uses: actions/setup-java@v4
    with:
      distribution: 'temurin'
      java-version: '17'

  - name: Setup Capacitor
    run: npm init -y && npm install @capacitor/core@6.2.0 @capacitor/cli@6.2.0 @capacitor/android@6.2.0 --no-audit --no-fund

  - name: Prepare Web Assets
    run: mkdir -p www && cp index.html www/ && cp -f icon-*.png www/ 2>/dev/null || true

  - name: Configure Capacitor
    run: printf '%s\n' '{"appId":"com.galacticarss.app","appName":"Galactica RSS","webDir":"www","server":{"androidScheme":"https","cleartext":true},"plugins":{"CapacitorHttp":{"enabled":true}}}' > capacitor.config.json

  - name: Add Android Platform
    run: npx cap add android

  - name: Configure Native Android
    run: |
      if [ -f "scripts/configure-android.js" ]; then node scripts/configure-android.js; elif [ -f "configure-android.js" ]; then node configure-android.js; fi

  - name: Sync Capacitor
    run: npx cap sync android

  - name: Build APK
    run: cd android && chmod +x gradlew && ./gradlew assembleDebug --no-daemon

  - uses: actions/upload-artifact@v4
    with:
      name: Galactica-RSS-Android
      path: android/app/build/outputs/apk/debug/app-debug.apk
