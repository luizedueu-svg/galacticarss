name: Build Android APK

on:
push:
branches:
- main
workflow_dispatch:

jobs:
build-android-apk:
runs-on: ubuntu-latest

steps:
  - name: Checkout repository
    uses: actions/checkout@v4

  - name: Setup Node.js 20
    uses: actions/setup-node@v4
    with:
      node-version: '20'

  - name: Setup Java 17
    uses: actions/setup-java@v4
    with:
      distribution: 'temurin'
      java-version: '17'

  - name: Garantir arquivos de configuracao
    run: |
      node -e '
        const fs = require("fs");
        if (!fs.existsSync("package.json")) {
          fs.writeFileSync("package.json", JSON.stringify({
            name: "galactica-rss-android",
            version: "4.2.0",
            private: true,
            dependencies: {
              "@capacitor/android": "^6.2.0",
              "@capacitor/cli": "^6.2.0",
              "@capacitor/core": "^6.2.0"
            }
          }, null, 2));
        }
        if (!fs.existsSync("capacitor.config.json")) {
          fs.writeFileSync("capacitor.config.json", JSON.stringify({
            appId: "com.galacticarss.app",
            appName: "Galactica RSS",
            webDir: "www",
            server: { androidScheme: "https", cleartext: true },
            plugins: { CapacitorHttp: { enabled: true } }
          }, null, 2));
        }
      '

  - name: Instalar dependencias do Capacitor
    run: npm install --no-audit --no-fund

  - name: Preparar pasta web (www)
    run: |
      mkdir -p www
      cp index.html www/
      [ -f icon-16.png ] && cp icon-16.png www/ || true
      [ -f icon-48.png ] && cp icon-48.png www/ || true
      [ -f icon-128.png ] && cp icon-128.png www/ || true

  - name: Gerar projeto Android nativo
    run: npx cap add android

  - name: Aplicar configuracoes nativas Android
    run: |
      if [ -f "scripts/configure-android.js" ]; then
        node scripts/configure-android.js
      elif [ -f "configure-android.js" ]; then
        node configure-android.js
      else
        echo "Aviso: configure-android.js nao encontrado, seguindo build padrao."
      fi

  - name: Sincronizar Capacitor
    run: npx cap sync android

  - name: Compilar APK Debug com Gradle
    run: |
      cd android
      chmod +x gradlew
      ./gradlew assembleDebug --no-daemon

  - name: Upload APK Artifact
    uses: actions/upload-artifact@v4
    with:
      name: Galactica-RSS-Android
      path: android/app/build/outputs/apk/debug/app-debug.apk
      retention-days: 30
